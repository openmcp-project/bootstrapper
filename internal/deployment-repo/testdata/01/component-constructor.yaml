        access:
          type: ociArtifact
          imageReference: ghcr.io/fluxcd/notification-controller:v1.9.4
      - name: image-source-controller
        version: v1.9.5
        type: ociImage
        access:
          type: ociArtifact
          imageReference: ghcr.io/fluxcd/source-controller:v1.9.5

  - name: github.com/openmcp-project/openmcp/releasechannel/flux
    version: v2.8.3
