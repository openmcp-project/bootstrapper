      - name: image-source-controller
        version: v1.8.1
        type: ociImage
        access:
          type: ociArtifact
          imageReference: ghcr.io/fluxcd/source-controller:v1.8.1

  - name: github.com/openmcp-project/openmcp/releasechannel/flux
    version: v2.9.5
