      - name: image-automation-controller
        version: v1.2.5
        type: ociImage
        access:
          type: ociArtifact
          imageReference: ghcr.io/fluxcd/image-automation-controller:v1.2.5
      - name: image-reflector-controller
        version: v1.2.5
        type: ociImage
        access:
          type: ociArtifact
          imageReference: ghcr.io/fluxcd/image-reflector-controller:v1.2.5
      - name: image-kustomize-controller
        version: v1.9.5
        type: ociImage
        access:
          type: ociArtifact
          imageReference: ghcr.io/fluxcd/kustomize-controller:v1.9.5
      - name: image-notification-controller
        version: v1.9.4
